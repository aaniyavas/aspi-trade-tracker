<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASPI Trade Agreements Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1>Non-U.S. Trade Agreements Tracker</h1>
    <p class="subtitle">Tracking FTAs, CEPAs, and economic integration efforts since January 2026</p>
  </header>

  <!-- Tabs let us switch between two views of the same underlying data -->
  <nav class="tabs">
    <button class="tab-button active" data-tab="table">Table</button>
    <button class="tab-button" data-tab="timeline">Timeline</button>
    <button class="tab-button" data-tab="map">Map</button>
  </nav>

  <!-- Filters are shared across both views -->
  <section class="filters">
    <input type="text" id="search-input" placeholder="Search countries, agreements..." />

    <select id="type-filter">
      <option value="">All Agreement Types</option>
    </select>

    <select id="month-filter">
      <option value="">All Months</option>
    </select>

    <span id="result-count" class="result-count"></span>
  </section>

  <!-- Status chips: one click filters by where an agreement is in its lifecycle.
       The buttons are drawn by app.js (renderStatusChips). -->
  <section id="status-chips" class="chips-row" aria-label="Filter by status"></section>

  <main>
    <!-- Table view: shown by default -->
    <section id="table-view" class="view active">
      <table id="tracker-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Parties</th>
            <th>Type</th>
            <th>Status</th>
            <th>Summary</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows get inserted here by JavaScript -->
        </tbody>
      </table>
    </section>

    <!-- Timeline view: hidden by default -->
    <section id="timeline-view" class="view">
      <div id="timeline-container">
        <!-- Month groups get inserted here by JavaScript -->
      </div>
    </section>

    <!-- Map view: Asia-centred dot map with a side panel (map.js) -->
    <section id="map-view" class="view">
      <div class="map-layout">
        <div id="map-stage" class="map-stage">
          <svg id="map-svg" viewBox="0 0 960 520" role="img" aria-label="Map of countries and blocs named in the tracker"></svg>
          <div id="map-tooltip" class="map-tooltip"></div>
          <div class="map-controls">
            <button id="map-zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="map-zoom-out" type="button" aria-label="Zoom out">&minus;</button>
            <button id="map-reset" type="button" aria-label="Reset map">&#8962;</button>
          </div>
          <div class="map-legend"><span class="lg lg-c"></span>Country <span class="lg lg-b"></span>Bloc &nbsp;|&nbsp; size = number of entries</div>
        </div>
        <aside id="map-panel" class="map-panel" aria-live="polite"></aside>
      </div>
    </section>
  </main>

  <!-- PapaParse: a small library that turns raw CSV text into JS arrays/objects.
       Vendored locally (not loaded from a CDN) so the page has no external
       dependency -- important for embedding on ASPI's site without relying
       on a third-party server staying up. -->
  <script src="papaparse.min.js"></script>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="geo.js"></script>
  <script src="app.js"></script>
  <script src="map.js"></script>
</body>
</html>
